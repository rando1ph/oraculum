<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>神谕</title>
  <link rel="stylesheet" href="splash.css">
  <script src="splash.js" defer></script>
</head>
<body>
  <main aria-label="神谕启动">
    <div class="awakening" aria-hidden="true">
      <i class="axis horizontal"></i><i class="axis vertical"></i>
      <img src="../../design/reference/03_Brand_OracleEye_Simplified_Icon.png" alt="">
      <i class="halo"></i><i class="core"></i>
    </div>
    <div class="identity"><h1>ORACULUM</h1><p class="name">神谕</p></div>
    <div class="declaration"><p class="mandate">意志为谕，万象将启。</p><p class="translation" lang="en">LET THE UNWRITTEN UNFOLD.</p></div>
    <p class="status" role="status">正在连接本机 Bridge</p>
    <section class="recovery" hidden aria-label="连接恢复">
      <h2>无法连接本机 Bridge</h2>
      <p>请检查运行配置、官方 Codex 和后台服务。</p>
      <p>首次安装需先完成数据选择与服务注册。</p>
      <div><a href="oraculum://retry">重新连接</a><a href="oraculum://quit" class="secondary">退出</a></div>
    </section>
  </main>
